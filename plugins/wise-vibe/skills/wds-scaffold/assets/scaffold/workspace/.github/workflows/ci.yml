name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  secret-scan:   # root repo only (integration docs, deployment scripts, release); config: .gitleaks.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --config /repo/.gitleaks.toml --redact --no-banner
  deploy-test:   # deployment checks only — service functional tests run in each sub repo's CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
