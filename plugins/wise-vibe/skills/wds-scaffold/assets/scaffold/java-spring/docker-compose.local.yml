# {{PROJECT_NAME}} — local 모드: SQLite + dev 스테이지(gradle bootRun) + 소스 바인드
services:
  api:
    build: { target: dev }
    env_file: [".env.local"]
    volumes:
      - ./:/src
      - appdata:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      start_period: 240s
