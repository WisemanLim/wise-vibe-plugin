# {{PROJECT_NAME}} — local 모드: dev 스테이지(Vite HMR) + 소스 바인드
services:
  web:
    build: { target: dev }
    env_file: [".env.local"]
    environment:
      # the Vite proxy reaches the API through host.docker.internal (IPv4 + IPv6); Node's happy-eyeballs gives each
      # family 250 ms and fails the whole connect (AggregateError ETIMEDOUT) under load
      NODE_OPTIONS: "--dns-result-order=ipv4first --no-network-family-autoselection"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    healthcheck:
      start_period: 30s
volumes:
  node_modules:
