[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url 은 migrations/env.py 가 DATABASE_URL 로 주입

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
