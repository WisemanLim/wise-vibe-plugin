[project]
name = "{{PROJECT_NAME}}"
version = "0.1.0"
description = "{{PROJECT_NAME}} — FastAPI service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
{{DB_DEPS}}
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

# 모든 테스트는 test/ 로 통일 (시험표준 dev-env/impl 도 test/ 하위)
[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.uv]
package = false
