# extras/rabbitmq — 선택 인프라 (scaffold --extras rabbitmq). make 가 compose/*.yml 을 자동 포함한다.
services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-app}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${BIND_HOST:-127.0.0.1}:${RABBITMQ_MGMT_PORT:-15672}:15672"
