id: workspace
title: "Workspace — 통합관리 root repo"
status: stable
kind: workspace                    # 스택 추천 대상 아님: 서브 프로젝트가 2개 이상일 때 함께 생성
summary: >
  통합관리 repo 에 서브 프로젝트 repo 를 (git 추적 없이) 포함하는 구조의 root.
  PRD·문서·release.sh(doctor·build·up·deploy·status·down·rollback)·비밀 init·배포 시험만 소유하고,
  기능 시험·결과는 각 서브 repo 가 소유한다.
when_to_use:
  - "서비스가 2개 이상의 독립 repo 로 나뉘고 함께 배포할 때 (예: API + worker + web 콘솔)"
  - "dev/prod 서버에 ssh 로 소스·이미지를 보내고 롤백·비밀 보존이 필요할 때"
avoid_when:
  - "단일 서비스 → 서비스 프로파일만 (make deploy)"
  - "Kubernetes GitOps 가 이미 정본 → Helm/Argo 저장소로 대체"

languages:
  primary: bash
  also: [python]

package_managers:
  default: none
  allowed: [none]
  notes: "bash 3.2 + python3 표준 라이브러리 (회귀 시험), Docker Compose ≥ 2.20"

layers:
  frontend: null
  backend: null
  database: null
  ops:
    ci: "GitHub Actions (gitleaks + make test)"
    deploy: "release/release.sh — 단일 서버 compose, releases/<V> + current + shared/ 비밀"

run_methods:
  container:
    local: "release/release.sh up --env dev --yes   # 이 머신에서 서브 프로젝트 prod 모드 리허설"
    prod: "release/release.sh deploy --env prod --host user@server"

environments:
  local: { db: per-subproject, compose: "서브 repo 의 prod compose (리허설)", notes: "release.sh up — 공유 네트워크 <ws>-net" }
  prod:  { db: per-subproject, compose: "서브 repo 의 prod compose + docker-compose.workspace.yml", notes: "release.sh deploy — ssh, 이미지 스트리밍, current 전환" }

scaffold:
  template: "workspace"
  args: "workspace --services <repo>:<api|web>:<host-port>[:db],... --name <ws>  (서브 repo 는 --workspace <ws>)"

testing:
  framework: "bash -n + python3 회귀 (test/deploy/test_source_archive.py, test_prod_secrets.py)"
  dir: "test/deploy/"
  cycle: "배포 시험만 — 기능 시험은 서브 repo test/impl/<Nth>/"

references:
  - "검증: EvidenceMesh root (2026-10-29 local dev 리허설 PASS — 결함 4건 반영)"
  - "패턴 출처: eden-AIAgent release/release.sh · DEPLOY-PROD-GUIDE.md"
